# Daily SMA 50/200 cross check, runs on GitHub's servers (your Mac can be off).
# Configure in: repo > Settings > Secrets and variables > Actions
#   Secrets  : SMTP_USER, SMTP_PASSWORD (Gmail App Password), ALERT_TO, NTFY_TOPIC
#   Variables: WATCHLIST (e.g. SPY,QQQ,AAPL), SMTP_HOST (default smtp.gmail.com), SMTP_PORT (465)
name: SMA crossover alert

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC, Mon-Fri, after the US close
  workflow_dispatch:
    inputs:
      mode:
        description: "check | test | digest"
        default: "check"

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check crosses and notify
        env:
          WATCHLIST: ${{ vars.WATCHLIST }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            test)   python -m quant.alert --test ;;
            digest) python -m quant.alert --digest ;;
            *)      python -m quant.alert ;;
          esac
